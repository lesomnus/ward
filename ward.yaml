# Ward's static configuration. Every value is written out; nothing is filled in
# for a value left out. A file, then the environment over the top of it:
# WARD_DB_DSN beats what is written here. `ward config` prints what came out,
# and `ward config env` lists every variable there is.

server:
  addr: ":14319"

db:
  driver: sqlite3
  # WAL, and synchronous(FULL): a committed Issue transition survives a power cut.
  dsn: "file:ward.db?_pragma=journal_mode(WAL)&_pragma=synchronous(FULL)&_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)"

watch:
  # Ward publishes no Watch. Its change feed is IssueEventService/Follow.
  broker: none

spin:
  # One process runs the sweeps.
  lease: local

audit:
  # The trail holds what callers did, such as an operator's acknowledgement. The
  # evaluation loop's own writes are not on it. Kept a year, then removed rather
  # than archived.
  retain: 8760h
  discard: true

# -- Ward's own blocks (conf.Ward) --

operator:
  # The longest an operator may shelve a Condition for.
  max_shelve: 8h

receivers:
  otlp:
    grpc: {endpoint: "0.0.0.0:14317"}
    http: {endpoint: "0.0.0.0:14318"}
    max_request_bytes: 4194304
    # Requests. When it is full, a Collector is told to try again.
    queue_size: 4096

engine:
  tick: 1s
  # Silence is judged up to now minus these: what was sent before has arrived.
  eval_lag: {log: 2s, metric: 3s}
  # As long as a Collector keeps retrying. Down longer, Ward closes its open
  # Issues as interrupted.diag_gap when it comes back.
  recovery_window: 120s
  checkpoint: 5s
  gate:
    hold: 15s
    unobservable_to_stale: 60s
    canary: {interval: 1s, timeout: 2s, max_rtt: 200ms, check_window: 30s, max_missing: 1}
  limits: {keys_per_rule: 50, new_issues_per_rule_per_minute: 5}

nodes:
  # A Collector on this computer that sets host.name=local on what it sends
  # (deploy/collector/collector.yaml with NODE_HOST_NAME=local).
  local: {match: {host.name: local}, collector: "127.0.0.1:4317"}

providers:
  - {name: local, type: file, path: example/providers/local.yaml, poll_interval: 10s, debounce: 200ms}

store:
  # Go durations: 720h is 30 days.
  retention: 720h

# OTLP exporters for Ward's own Issue transitions and metrics; none here.
exporters: []
