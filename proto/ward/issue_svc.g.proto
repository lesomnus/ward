edition = "2023";
package ward;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "ward/issue.proto";

option go_package = "github.com/lesomnus/ward";

service IssueService {
  // Add creates a new Issue
  rpc Add(IssueAddRequest) returns (Issue);
  // Get retrieves a Issue
  rpc Get(IssueGetRequest) returns (Issue);
  // Patch updates an existing Issue
  rpc Patch(IssuePatchRequest) returns (Issue);
  // Apply applies a patch document to an existing Issue
  rpc Apply(IssueApplyRequest) returns (Issue);
  // Erase deletes a Issue
  rpc Erase(IssueRef) returns (IssueEraseResponse);
  // List reads Issues a page at a time.
  rpc List(IssueListRequest) returns (IssueListResponse);
}

message IssueAddRequest {
  bytes id = 1;
  string rule = 8 [features.field_presence = IMPLICIT];
  string source = 9 [features.field_presence = IMPLICIT];
  string node = 10 [features.field_presence = IMPLICIT];
  string key = 11 [features.field_presence = IMPLICIT];
  string severity = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  string state = 16 [features.field_presence = IMPLICIT];
  string level = 17 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_opened = 18;
  google.protobuf.Timestamp date_seen = 19;
  google.protobuf.Timestamp date_cleared = 20;
  google.protobuf.Timestamp date_closed = 21;
  string close_reason = 22 [features.field_presence = IMPLICIT];
  int64 count = 23 [features.field_presence = IMPLICIT];
  int64 restarts = 24 [features.field_presence = IMPLICIT];
  bool attention = 25 [features.field_presence = IMPLICIT];
  bool acked = 26 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_acked = 27;
  google.protobuf.Timestamp date_reset = 28;
  bool suppressed = 29 [features.field_presence = IMPLICIT];
  bool shelved = 30 [features.field_presence = IMPLICIT];
  bool out_of_service = 31 [features.field_presence = IMPLICIT];
}

message IssueGetRequest {
  IssueRef ref = 1;
  IssueSelect select = 2;
}

message IssueRef {
  oneof key {
    bytes id = 1;
  }
}

message IssueSelect {
  bool all = 1;
  bool rule = 8;
  bool source = 9;
  bool node = 10;
  bool key = 11;
  bool severity = 12;
  bool date_updated = 13;
  bool date_created = 15;
  bool state = 16;
  bool level = 17;
  bool date_opened = 18;
  bool date_seen = 19;
  bool date_cleared = 20;
  bool date_closed = 21;
  bool close_reason = 22;
  bool count = 23;
  bool restarts = 24;
  bool attention = 25;
  bool acked = 26;
  bool date_acked = 27;
  bool date_reset = 28;
  bool suppressed = 29;
  bool shelved = 30;
  bool out_of_service = 31;
}

message IssuePatchRequest {
  IssueRef ref = 1;
  string rule = 16;
  string source = 18;
  string node = 20;
  string key = 22;
  string severity = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  string state = 32;
  string level = 34;
  google.protobuf.Timestamp date_opened = 36;
  google.protobuf.Timestamp date_seen = 38;
  google.protobuf.Timestamp date_cleared = 40;
  // Clear date_cleared instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_cleared clears.
  bool date_cleared_null = 41;
  google.protobuf.Timestamp date_closed = 42;
  // Clear date_closed instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_closed clears.
  bool date_closed_null = 43;
  string close_reason = 44;
  int64 count = 46;
  int64 restarts = 48;
  bool attention = 50;
  bool acked = 52;
  google.protobuf.Timestamp date_acked = 54;
  // Clear date_acked instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_acked clears.
  bool date_acked_null = 55;
  google.protobuf.Timestamp date_reset = 56;
  // Clear date_reset instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_reset clears.
  bool date_reset_null = 57;
  bool suppressed = 58;
  bool shelved = 60;
  bool out_of_service = 62;
}

message IssueApplyRequest {
  IssueRef ref = 1;
  patch.Patch patch = 2;
}

message IssueEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message IssueListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated IssueFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message IssueListResponse {
  repeated Issue items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message IssueFilter {
  IssueRef ref = 1;
  string state = 2;
  string rule = 3;
  string node = 4;
  bool attention = 5;
}
